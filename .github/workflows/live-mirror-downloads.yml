name: Live Mirror Downloads

on:
  push:
    paths: ['tools/**', 'requirements.txt']
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

jobs:
  mirror-downloads:
    name: Live mirror validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - name: Install dependencies
        run: |
          echo "::group::Install dependencies"
          uv pip install --system -r requirements.txt
          echo "::notice title=Dependencies ready::Live mirror test environment installed."
          echo "::endgroup::"
      - name: Locate Android aapt
        id: aapt
        run: |
          echo "::group::Locate Android aapt"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1 || true)"
          if [ -z "$AAPT" ]; then
            sudo apt-get update
            sudo apt-get install -y aapt
            AAPT="$(command -v aapt)"
          fi
          test -x "$AAPT"
          echo "path=$AAPT" >> "$GITHUB_OUTPUT"
          echo "::notice title=aapt ready::$AAPT"
          echo "::endgroup::"
      - name: Download and validate every AudioRelay mirror
        env:
          RUN_LIVE_MIRROR_TESTS: '1'
          AAPT: ${{ steps.aapt.outputs.path }}
        run: |
          echo "::group::Validate every configured AudioRelay mirror"
          set -o pipefail
          set +e
          python -m unittest tests.test_mirror_download_live -v 2>&1 | tee mirror-output.log
          status=${PIPESTATUS[0]}
          set -e
          echo "::endgroup::"
          {
            echo "### Live mirror validation"
            echo
            if [ "$status" -eq 0 ]; then
              echo "Result: **PASS**"
            else
              echo "Result: **FAIL**"
            fi
            echo
            echo "| Mirror result |"
            echo "| --- |"
            grep '^OK mirror=' mirror-output.log | sed 's/^/| /' || true
            grep -E 'Ran [0-9]+ tests|^OK$|^FAILED' mirror-output.log || true
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 0 ]; then
            echo "::notice title=All mirrors passed::Every configured mirror downloaded and validated the exact version."
          else
            echo "::error title=Mirror validation failed::One or more mirror checks failed. See the grouped test output above."
            exit "$status"
          fi
