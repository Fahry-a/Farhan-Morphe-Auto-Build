name: Daily Morphe Auto Build

on:
  schedule:
    # 02:00 UTC = 09:00 WIB, daily
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths: ['apps/**', 'tools/**', '.github/workflows/build.yml', 'requirements.txt']
  workflow_dispatch:
    inputs:
      app:
        description: 'App id (all, or any id in apps/)'
        required: false
        default: 'all'
        type: string
      arch:
        description: 'Arch name (all, or e.g. arm64)'
        required: false
        default: 'all'
        type: string
      direct_apk_url:
        description: 'Direct APK URL (manual fallback). Single-app only.'
        required: false
        type: string
      allow_experimental:
        description: 'Allow experimental targets from patches-list.json'
        required: false
        default: false
        type: boolean
      rebuild:
        description: 'Force a rebuild even if the asset already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: morphe-auto-build
  cancel-in-progress: false

env:
  MORPHE_CLI_VERSION: '1.16.0'
  MORPHE_CLI_SHA256: '85c222421f07bb67098d191b9870323199fea871ddab53fcd6de915ca70e5fe6'

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate manual inputs
        env:
          ONLY_APP: ${{ inputs.app }}
          ONLY_ARCH: ${{ inputs.arch }}
          DIRECT_APK_URL: ${{ inputs.direct_apk_url }}
        run: |
          if [ -n "$DIRECT_APK_URL" ] && { [ "$ONLY_APP" = "all" ] || [ "$ONLY_ARCH" = "all" ]; }; then
            echo "::error::direct_apk_url requires a single app and a single arch."
            exit 1
          fi      - name: Validate base package
        if: steps.check.outputs.skip != 'true'
        run: |
          BASE_FILE="${{ steps.download.outputs.base_file }}"
          FILE_TYPE="${{ steps.download.outputs.file_type }}"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          python3 -c "from tools.common import validate_package; print(f'Validated {BASE_FILE}: {validate_package(BASE_FILE, FILE_TYPE, expected_version=\"${{ steps.resolve.outputs.apk_version }}\", aapt_path=\"{BUILD_TOOLS_DIR}/aapt\")} ZIP entries')"
