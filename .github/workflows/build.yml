name: Daily Morphe Auto Build

on:
  schedule:
    # 02:00 UTC = 09:00 WIB, daily
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths: ['apps/**', 'tools/**', '.github/workflows/build.yml', 'requirements.txt']
  workflow_dispatch:
    inputs:
      app:
        description: 'App id (all, or any id in apps/)'
        required: false
        default: 'all'
        type: string
      arch:
        description: 'Arch name (all, or e.g. arm64)'
        required: false
        default: 'all'
        type: string
      direct_apk_url:
        description: 'Direct APK URL (manual fallback). Single-app only.'
        required: false
        type: string
      allow_experimental:
        description: 'Allow experimental targets from patches-list.json'
        required: false
        default: false
        type: boolean
      rebuild:
        description: 'Force a rebuild even if the asset already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: morphe-auto-build
  cancel-in-progress: false

env:
  MORPHE_CLI_VERSION: '1.16.0'
  MORPHE_CLI_SHA256: '85c222421f07bb67098d191b9870323199fea871ddab53fcd6de915ca70e5fe6'

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate manual inputs
        env:
          ONLY_APP: ${{ inputs.app }}
          ONLY_ARCH: ${{ inputs.arch }}
          DIRECT_APK_URL: ${{ inputs.direct_apk_url }}
        run: |
          if [ -n "$DIRECT_APK_URL" ] && { [ "$ONLY_APP" = "all" ] || [ "$ONLY_ARCH" = "all" ]; }; then
            echo "::error::direct_apk_url requires a single app and a single arch."
            exit 1
          fi
      - id: list
        env:
          ONLY_APP: ${{ inputs.app }}
          ONLY_ARCH: ${{ inputs.arch }}
        run: |
          MATRIX=$(python3 -c "
          import glob, json, os
          only_app = os.environ.get('ONLY_APP') or 'all'
          only_arch = os.environ.get('ONLY_ARCH') or 'all'
          pairs = []
          for path in sorted(glob.glob('apps/*.json')):
              cfg = json.load(open(path))
              if cfg.get('enabled', True) is False:
                  continue
              if only_app != 'all' and cfg['id'] != only_app:
                  continue
              for arch in cfg['source'].get('archs', []):
                  if only_arch != 'all' and arch['name'] != only_arch:
                      continue
                  pairs.append({'app': cfg['id'], 'arch': arch['name'], 'config': path})
          print(json.dumps(pairs))
          ")
          if [ "$MATRIX" = "[]" ]; then
            echo "::error::No enabled app/arch pair matched the requested inputs."
            exit 1
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Pairs: $MATRIX"

  build:
    needs: setup
    if: needs.setup.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21 (for the morphe-desktop CLI)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@2f566fa1a0200a97cd444dd84f358329668ebe60 # v7
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Python deps + Playwright Chromium
        run: |
          uv pip install --system -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Resolve patch + APK version
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA=""
          if [ "${{ inputs.allow_experimental }}" = "true" ]; then EXTRA="--allow-experimental"; fi
          python3 tools/resolve_version.py --config "${{ matrix.config }}" $EXTRA --json-out resolved.json
          cat resolved.json
          MPP_URL=$(python3 -c "import json; print(json.load(open('resolved.json'))['mpp_url'])")
          MPP_VER=$(python3 -c "import json; print(json.load(open('resolved.json'))['mpp_version'])")
          APK_VER=$(python3 -c "import json; print(json.load(open('resolved.json'))['apk_version'])")
          echo "mpp_url=$MPP_URL" >> $GITHUB_OUTPUT
          echo "mpp_version=$MPP_VER" >> $GITHUB_OUTPUT
          echo "apk_version=$APK_VER" >> $GITHUB_OUTPUT

      - name: Check monthly release for existing assets
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(date -u +%Y-%m)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          VER="${{ steps.resolve.outputs.apk_version }}"
          EXPECTED=$(python3 -c "
          import json
          cfg = json.load(open('${{ matrix.config }}'))
          print(' '.join('${{ matrix.app }}-${{ matrix.arch }}-v$VER' + f.get('output_suffix', '') + '.apk' for f in cfg['flavors']))
          ")
          echo "Expected: $EXPECTED"
          HAVE=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || true)
          MISSING=0
          for f in $EXPECTED; do
            echo "$HAVE" | grep -qx "$f" || MISSING=1
          done
          if [ "$MISSING" = "0" ]; then
            echo "All assets already in $TAG, skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Download prebuilt .mpp
        if: steps.check.outputs.skip != 'true'
        run: |
          curl --fail --location --retry 3 --retry-all-errors -o patches.mpp "${{ steps.resolve.outputs.mpp_url }}"
          ls -la patches.mpp

      - name: Download base package
        id: download
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIRECT_APK_URL: ${{ inputs.direct_apk_url }}
        run: |
          TYPE=$(python3 -c "import json; print(json.load(open('${{ matrix.config }}'))['source']['type'])")
          FILE_TYPE=$(python3 -c "import json; print(json.load(open('${{ matrix.config }}'))['source'].get('file_type', 'apk'))")
          case "$FILE_TYPE" in
            apkm) BASE_FILE="base.apkm" ;;
            xapk) BASE_FILE="base.xapk" ;;
            *) BASE_FILE="base.apk" ;;
          esac
          echo "base_file=$BASE_FILE" >> $GITHUB_OUTPUT
          echo "file_type=$FILE_TYPE" >> $GITHUB_OUTPUT
          if [ -n "$DIRECT_APK_URL" ]; then
            echo "Using manual direct APK URL"
            BASE_FILE="$BASE_FILE" python3 - <<'PY'
          import os
          from curl_cffi import requests
          url = os.environ["DIRECT_APK_URL"]
          output = os.environ["BASE_FILE"]
          r = requests.get(url, impersonate="chrome131", stream=True, timeout=120)
          r.raise_for_status()
          total = 0
          with open(output, "wb") as fh:
              for ch in r.iter_content(8192):
                  if ch:
                      fh.write(ch)
                      total += len(ch)
          print(f"{total:,} bytes")
          PY
          elif [ "$TYPE" = "apkmirror" ]; then
            python3 tools/apkmirror.py --config "${{ matrix.config }}" \
              --arch "${{ matrix.arch }}" \
              --exact-version "${{ steps.resolve.outputs.apk_version }}" \
              --output "$BASE_FILE"
          elif [ "$TYPE" = "direct" ]; then
            python3 tools/direct.py --config "${{ matrix.config }}" \
              --arch "${{ matrix.arch }}" \
              --exact-version "${{ steps.resolve.outputs.apk_version }}" \
              --output "$BASE_FILE"
          elif [ "$TYPE" = "github" ]; then
            python3 tools/github_source.py --config "${{ matrix.config }}" \
              --arch "${{ matrix.arch }}" \
              --apk-version "${{ steps.resolve.outputs.apk_version }}" \
              --output "$BASE_FILE"
          elif [ "$TYPE" = "mirrors" ]; then
            python3 tools/mirror_download.py --config "${{ matrix.config }}" \
              --arch "${{ matrix.arch }}" \
              --exact-version "${{ steps.resolve.outputs.apk_version }}" \
              --output "$BASE_FILE"
          else
            echo "Unknown source.type: $TYPE"; exit 1
          fi
          ls -la base.*

      - name: Validate base package
        if: steps.check.outputs.skip != 'true'
        run: |
          BASE_FILE="${{ steps.download.outputs.base_file }}"
          FILE_TYPE="${{ steps.download.outputs.file_type }}"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          python3 -c "from tools.common import validate_package; print(f'Validated {BASE_FILE}: {validate_package(BASE_FILE, FILE_TYPE, expected_version="${{ steps.resolve.outputs.apk_version }}", aapt_path="{BUILD_TOOLS_DIR}/aapt")} ZIP entries')"

      - name: Setup Morphe CLI
        if: steps.check.outputs.skip != 'true'
        env:
          MORPHE_CLI_VERSION: ${{ env.MORPHE_CLI_VERSION }}
        run: |
          CLI_URL="https://github.com/MorpheApp/morphe-desktop/releases/download/v$MORPHE_CLI_VERSION/morphe-desktop-$MORPHE_CLI_VERSION-all.jar"
          echo "CLI: $CLI_URL"
          curl --fail --location --retry 3 --retry-all-errors -o morphe-cli.jar "$CLI_URL"
          test -s morphe-cli.jar
          echo "$MORPHE_CLI_SHA256  morphe-cli.jar" | sha256sum --check --status
          echo "Morphe CLI checksum verified."

      - name: Patch all flavors
        if: steps.check.outputs.skip != 'true'
        run: |
          python3 tools/patch.py --config "${{ matrix.config }}" \
            --arch "${{ matrix.arch }}" \
            --cli morphe-cli.jar --mpp patches.mpp --base "${{ steps.download.outputs.base_file }}" \
            --workdir . --manifest-out manifest.json

      - name: Sign APKs
        if: steps.check.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          printf "%s" "$KEYSTORE_BASE64" | base64 -d > release.keystore
          # Defaults keep backward compatibility; set the secrets to change them.
          KS_PASS="${KEYSTORE_PASSWORD:-android}"
          KEY_PASS="${KEY_PASSWORD:-android}"
          VER="${{ steps.resolve.outputs.apk_version }}"
          BASE_FILE="${{ steps.download.outputs.base_file }}"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Build-tools: $BUILD_TOOLS_DIR"
          # Sanity check (base already validated; APK version re-confirmed here)
          if [ "${{ steps.download.outputs.file_type }}" = "apk" ]; then
            AAPT=$($BUILD_TOOLS_DIR/aapt dump badging "$BASE_FILE" | grep -oP "versionName='\K[^']+" || true)
            echo "aapt $BASE_FILE version: $AAPT (resolver: $VER)"
          fi
          # Sign every file listed in the patch manifest (never reconstruct names).
          FILES=""
          for ROW in $(python3 -c "import json; [print(f\"{e['file']},{e['suffix']}\") for e in json.load(open('manifest.json'))]"); do
            UNSIGNED="${ROW%,*}"
            SUFFIX="${ROW#*,}"
            FINAL="${{ matrix.app }}-${{ matrix.arch }}-v${VER}${SUFFIX}.apk"
            ALIGNED="${UNSIGNED%.apk}-aligned.apk"
            echo "== Sign $UNSIGNED -> $FINAL"
            $BUILD_TOOLS_DIR/zipalign -v 4 "$UNSIGNED" "$ALIGNED"
            $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:"$KS_PASS" --key-pass pass:"$KEY_PASS" ${KEY_ALIAS:+--ks-key-alias "$KEY_ALIAS"} --out "$FINAL" "$ALIGNED"
            $BUILD_TOOLS_DIR/apksigner verify --verbose "$FINAL"
            FILES="$FILES $FINAL"
          done
          # Fragment consumed by the publish job.
          python3 -c "
          import json
          cfg = json.load(open('${{ matrix.config }}'))
          files = '''$FILES'''.split()
          frag = {'app': cfg['id'], 'display': cfg.get('display_name', cfg['id']),
                  'arch': '${{ matrix.arch }}',
                  'apk_version': '$VER',
                  'mpp_version': '${{ steps.resolve.outputs.mpp_version }}',
                  'build_date': '$(date -u +%Y-%m-%d)',
                  'files': files}
          open('fragment-${{ matrix.app }}-${{ matrix.arch }}.json', 'w').write(json.dumps(frag, indent=2))
          print(json.dumps(frag, indent=2))
          "
          rm -f release.keystore

      - name: Upload build artifacts
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ready-${{ matrix.app }}-${{ matrix.arch }}
          path: |
            ${{ matrix.app }}-${{ matrix.arch }}-v*.apk
            fragment-${{ matrix.app }}-${{ matrix.arch }}.json

  publish:
    needs: build
    # One failing app must not block the others: with no fragments this job
    # exits cleanly without touching the release.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: ready-*
          merge-multiple: true
          path: dist
      - name: Update monthly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          TAG=$(date -u +%Y-%m)
          ls -la dist || true
          python3 -c "
          import glob, json
          frags = [json.load(open(p)) for p in sorted(glob.glob('dist/fragment-*.json'))]
          open('builds.json', 'w').write(json.dumps({'builds': frags}, indent=2))
          print(f'{len(frags)} bundle(s) to publish')
          "
          if [ "$(python3 -c "import json; print(len(json.load(open('builds.json'))['builds']))")" = "0" ]; then
            echo "Nothing new, monthly release untouched."
            exit 0
          fi
          cp dist/*.apk . 2>/dev/null || true
          python3 tools/monthly_release.py --tag "$TAG" --builds builds.json
