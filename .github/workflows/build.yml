name: Daily Morphe Auto Build

on:
  schedule:
    # 02:00 UTC = 09:00 WIB, daily
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths: ['apps/**', 'tools/**', '.github/workflows/build.yml', 'requirements.txt']
  workflow_dispatch:
    inputs:
      app:
        description: 'App id (all, or any id in apps/)'
        required: false
        default: 'all'
        type: string
      arch:
        description: 'Arch name (all, or e.g. arm64)'
        required: false
        default: 'all'
        type: string
      version_override:
        description: 'APK version override (without v). Single-app only. Empty = follow patch.'
        required: false
        type: string
      direct_apk_url:
        description: 'Direct APK URL (manual fallback). Single-app only.'
        required: false
        type: string
      allow_experimental:
        description: 'Allow experimental targets from patches-list.json'
        required: false
        default: false
        type: boolean
      rebuild:
        description: 'Force a rebuild even if the asset already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          ONLY_APP: ${{ inputs.app }}
          ONLY_ARCH: ${{ inputs.arch }}
        run: |
          MATRIX=$(python3 -c "
          import glob, json, os
          only_app = os.environ.get('ONLY_APP') or 'all'
          only_arch = os.environ.get('ONLY_ARCH') or 'all'
          pairs = []
          for path in sorted(glob.glob('apps/*.json')):
              cfg = json.load(open(path))
              if only_app != 'all' and cfg['id'] != only_app:
                  continue
              for arch in cfg['source'].get('archs', []):
                  if only_arch != 'all' and arch['name'] != only_arch:
                      continue
                  pairs.append({'app': cfg['id'], 'arch': arch['name'], 'config': path})
          print(json.dumps(pairs))
          ")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Pairs: $MATRIX"

  build:
    needs: setup
    if: needs.setup.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21 (for the morphe-desktop CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps + Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Resolve patch + APK version
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA=""
          if [ "${{ inputs.allow_experimental }}" = "true" ]; then EXTRA="--allow-experimental"; fi
          python3 tools/resolve_version.py --config "${{ matrix.config }}" $EXTRA --json-out resolved.json
          cat resolved.json
          MPP_URL=$(python3 -c "import json; print(json.load(open('resolved.json'))['mpp_url'])")
          MPP_VER=$(python3 -c "import json; print(json.load(open('resolved.json'))['mpp_version'])")
          APK_VER=$(python3 -c "import json; print(json.load(open('resolved.json'))['apk_version'])")
          if [ -n "${{ inputs.version_override }}" ]; then
            APK_VER="${{ inputs.version_override }}"
            echo "Version override: $APK_VER"
          fi
          echo "mpp_url=$MPP_URL" >> $GITHUB_OUTPUT
          echo "mpp_version=$MPP_VER" >> $GITHUB_OUTPUT
          echo "apk_version=$APK_VER" >> $GITHUB_OUTPUT

      - name: Check monthly release for existing assets
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(date -u +%Y-%m)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          VER="${{ steps.resolve.outputs.apk_version }}"
          EXPECTED=$(python3 -c "
          import json
          cfg = json.load(open('${{ matrix.config }}'))
          print(' '.join('${{ matrix.app }}-${{ matrix.arch }}-v$VER' + f.get('output_suffix', '') + '.apk' for f in cfg['flavors']))
          ")
          echo "Expected: $EXPECTED"
          HAVE=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || true)
          MISSING=0
          for f in $EXPECTED; do
            echo "$HAVE" | grep -qx "$f" || MISSING=1
          done
          if [ "$MISSING" = "0" ]; then
            echo "All assets already in $TAG, skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Download prebuilt .mpp
        if: steps.check.outputs.skip != 'true'
        run: |
          curl -L -o patches.mpp "${{ steps.resolve.outputs.mpp_url }}"
          ls -la patches.mpp

      - name: Download base package
        id: download
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TYPE=$(python3 -c "import json; print(json.load(open('${{ matrix.config }}'))['source']['type'])")
          FILE_TYPE=$(python3 -c "import json; print(json.load(open('${{ matrix.config }}'))['source'].get('file_type', 'apk'))")
          if [ "$FILE_TYPE" = "apkm" ]; then BASE_FILE="base.apkm"; else BASE_FILE="base.apk"; fi
          echo "base_file=$BASE_FILE" >> $GITHUB_OUTPUT
          echo "file_type=$FILE_TYPE" >> $GITHUB_OUTPUT
          if [ -n "${{ inputs.direct_apk_url }}" ]; then
            echo "Using manual direct APK URL"
            python3 -c "
          from curl_cffi import requests
          url = '${{ inputs.direct_apk_url }}'
          r = requests.get(url, impersonate='chrome131', stream=True, timeout=120)
          r.raise_for_status()
          total = 0
          with open('$BASE_FILE', 'wb') as fh:
              for ch in r.iter_content(8192):
                  if ch:
                      fh.write(ch); total += len(ch)
          print(f'{total:,} bytes')
          "
          elif [ "$TYPE" = "apkmirror" ]; then
            python3 tools/apkmirror.py --config "${{ matrix.config }}" \
              --arch "${{ matrix.arch }}" \
              --exact-version "${{ steps.resolve.outputs.apk_version }}" \
              --output "$BASE_FILE"
          elif [ "$TYPE" = "github" ]; then
            python3 tools/github_source.py --config "${{ matrix.config }}" \
              --arch "${{ matrix.arch }}" \
              --apk-version "${{ steps.resolve.outputs.apk_version }}" \
              --output "$BASE_FILE"
          else
            echo "Unknown source.type: $TYPE"; exit 1
          fi
          ls -la "$BASE_FILE"

      - name: Validate base package
        if: steps.check.outputs.skip != 'true'
        run: |
          BASE_FILE="${{ steps.download.outputs.base_file }}"
          FILE_TYPE="${{ steps.download.outputs.file_type }}"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          if [ "$FILE_TYPE" = "apk" ]; then
            echo "Validating $BASE_FILE with aapt..."
            AAPT_VER=$($BUILD_TOOLS_DIR/aapt dump badging "$BASE_FILE" | grep -oP "versionName='\K[^']+") || {
              echo "ERROR: aapt cannot read $BASE_FILE - not a valid APK. Refusing to patch."; exit 1; }
            echo "aapt version: $AAPT_VER (resolver: ${{ steps.resolve.outputs.apk_version }})"
            if [ "$AAPT_VER" != "${{ steps.resolve.outputs.apk_version }}" ]; then
              echo "ERROR: downloaded version $AAPT_VER != expected ${{ steps.resolve.outputs.apk_version }}, refusing to patch."; exit 1
            fi
          else
            echo "Validating $BASE_FILE bundle contents..."
            python3 -c "
          import sys, zipfile
          names = zipfile.ZipFile('$BASE_FILE').namelist()
          apks = [n for n in names if n.endswith('.apk')]
          print(f'{len(names)} zip entries, {len(apks)} APK entries')
          sys.exit(0 if apks else 1)
          " || { echo "ERROR: $BASE_FILE is not a valid bundle. Refusing to patch."; exit 1; }
          fi

      - name: Setup Morphe CLI
        if: steps.check.outputs.skip != 'true'
        run: |
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | grep "browser_download_url.*morphe-desktop.*all.jar" | cut -d '"' -f 4 | head -n 1)
          if [ -z "$CLI_URL" ]; then
            CLI_URL="https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar"
          fi
          echo "CLI: $CLI_URL"
          curl -L -o morphe-cli.jar "$CLI_URL"

      - name: Patch all flavors
        if: steps.check.outputs.skip != 'true'
        run: |
          python3 tools/patch.py --config "${{ matrix.config }}" \
            --arch "${{ matrix.arch }}" \
            --cli morphe-cli.jar --mpp patches.mpp --base "${{ steps.download.outputs.base_file }}" \
            --workdir . --manifest-out manifest.json

      - name: Sign APKs
        if: steps.check.outputs.skip != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          # Defaults keep backward compatibility; set the secrets to change them.
          KS_PASS="${KEYSTORE_PASSWORD:-android}"
          KEY_PASS="${KEY_PASSWORD:-android}"
          VER="${{ steps.resolve.outputs.apk_version }}"
          BASE_FILE="${{ steps.download.outputs.base_file }}"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Build-tools: $BUILD_TOOLS_DIR"
          # Sanity check (base already validated; APK version re-confirmed here)
          if [ "${{ steps.download.outputs.file_type }}" = "apk" ]; then
            AAPT=$($BUILD_TOOLS_DIR/aapt dump badging "$BASE_FILE" | grep -oP "versionName='\K[^']+" || true)
            echo "aapt $BASE_FILE version: $AAPT (resolver: $VER)"
          fi
          # Sign every file listed in the patch manifest (never reconstruct names).
          FILES=""
          for ROW in $(python3 -c "import json; [print(f\"{e['file']},{e['suffix']}\") for e in json.load(open('manifest.json'))]"); do
            UNSIGNED="${ROW%,*}"
            SUFFIX="${ROW#*,}"
            FINAL="${{ matrix.app }}-${{ matrix.arch }}-v${VER}${SUFFIX}.apk"
            ALIGNED="${UNSIGNED%.apk}-aligned.apk"
            echo "== Sign $UNSIGNED -> $FINAL"
            $BUILD_TOOLS_DIR/zipalign -v 4 "$UNSIGNED" "$ALIGNED"
            python3 -c "import zipfile; i=zipfile.ZipFile('$ALIGNED','r'); o=zipfile.ZipFile('$ALIGNED.fixed','w',compression=zipfile.ZIP_DEFLATED); [o.writestr(x,i.read(x.filename)) for x in i.infolist()]; i.close(); o.close()"
            mv "$ALIGNED.fixed" "$ALIGNED"
            $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:"$KS_PASS" --key-pass pass:"$KEY_PASS" ${KEY_ALIAS:+--ks-key-alias "$KEY_ALIAS"} --out "$FINAL" "$ALIGNED"
            FILES="$FILES $FINAL"
          done
          # Fragment consumed by the publish job.
          python3 -c "
          import json
          cfg = json.load(open('${{ matrix.config }}'))
          files = '''$FILES'''.split()
          frag = {'app': cfg['id'], 'display': cfg.get('display_name', cfg['id']),
                  'arch': '${{ matrix.arch }}',
                  'apk_version': '$VER',
                  'mpp_version': '${{ steps.resolve.outputs.mpp_version }}',
                  'build_date': '$(date -u +%Y-%m-%d)',
                  'files': files}
          open('fragment-${{ matrix.app }}-${{ matrix.arch }}.json', 'w').write(json.dumps(frag, indent=2))
          print(json.dumps(frag, indent=2))
          "
          rm -f release.keystore

      - name: Upload build artifacts
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ready-${{ matrix.app }}-${{ matrix.arch }}
          path: |
            ${{ matrix.app }}-${{ matrix.arch }}-v*.apk
            fragment-${{ matrix.app }}-${{ matrix.arch }}.json

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'failure' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ready-*
          merge-multiple: true
          path: dist
      - name: Update monthly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          TAG=$(date -u +%Y-%m)
          ls -la dist || true
          python3 -c "
          import glob, json
          frags = [json.load(open(p)) for p in sorted(glob.glob('dist/fragment-*.json'))]
          open('builds.json', 'w').write(json.dumps({'builds': frags}, indent=2))
          print(f'{len(frags)} bundle(s) to publish')
          "
          if [ "$(python3 -c "import json; print(len(json.load(open('builds.json'))['builds']))")" = "0" ]; then
            echo "Nothing new, monthly release untouched."
            exit 0
          fi
          cp dist/*.apk . 2>/dev/null || true
          python3 tools/monthly_release.py --tag "$TAG" --builds builds.json
