name: Daily Morphe Auto Build

on:
  schedule:
    # 02:00 UTC = 09:00 WIB, daily
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths: ['apps/**', 'tools/**', '.github/workflows/build.yml', 'requirements.txt']
  workflow_dispatch:
    inputs:
      app:
        description: 'App id (all / google-photos / brave / any new id in apps/)'
        required: false
        default: 'all'
        type: string
      version_override:
        description: 'APK version override (without v). Single-app only. Empty = follow patch.'
        required: false
        type: string
      direct_apk_url:
        description: 'Direct APK URL (manual fallback). Single-app only.'
        required: false
        type: string
      allow_experimental:
        description: 'Allow experimental targets from patches-list.json'
        required: false
        default: false
        type: boolean
      rebuild:
        description: 'Force a rebuild even if the release already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          ONLY="${{ inputs.app }}"
          if [ -z "$ONLY" ]; then ONLY="all"; fi
          MATRIX=$(python3 -c "
          import glob, json, os
          only = os.environ.get('ONLY', 'all')
          apps = sorted([p.split('/')[-1][:-5] for p in glob.glob('apps/*.json')])
          if only and only != 'all':
              apps = [a for a in apps if a == only]
          print(json.dumps(apps))
          ")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Apps: $MATRIX"

  build:
    needs: setup
    if: needs.setup.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21 (for the morphe-desktop CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps + Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Resolve patch + APK version
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CFG="apps/${{ matrix.app }}.json"
          EXTRA=""
          if [ "${{ inputs.allow_experimental }}" = "true" ]; then EXTRA="--allow-experimental"; fi
          python3 tools/resolve_version.py --config "$CFG" $EXTRA --json-out resolved.json
          cat resolved.json
          MPP_URL=$(python3 -c "import json; print(json.load(open('resolved.json'))['mpp_url'])")
          MPP_VER=$(python3 -c "import json; print(json.load(open('resolved.json'))['mpp_version'])")
          APK_VER=$(python3 -c "import json; print(json.load(open('resolved.json'))['apk_version'])")
          if [ -n "${{ inputs.version_override }}" ]; then
            APK_VER="${{ inputs.version_override }}"
            echo "Version override: $APK_VER"
          fi
          PREFIX=$(python3 -c "import json; print(json.load(open('$CFG'))['release_tag_prefix'])")
          echo "mpp_url=$MPP_URL" >> $GITHUB_OUTPUT
          echo "mpp_version=$MPP_VER" >> $GITHUB_OUTPUT
          echo "apk_version=$APK_VER" >> $GITHUB_OUTPUT
          echo "tag=${PREFIX}v${APK_VER}" >> $GITHUB_OUTPUT

      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Download prebuilt .mpp
        if: steps.check.outputs.skip != 'true'
        run: |
          curl -L -o patches.mpp "${{ steps.resolve.outputs.mpp_url }}"
          ls -la patches.mpp

      - name: Download base APK
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CFG="apps/${{ matrix.app }}.json"
          TYPE=$(python3 -c "import json; print(json.load(open('$CFG'))['source']['type'])")
          if [ -n "${{ inputs.direct_apk_url }}" ]; then
            echo "Using manual direct APK URL"
            python3 -c "
          from curl_cffi import requests
          import sys
          url = '${{ inputs.direct_apk_url }}'
          r = requests.get(url, impersonate='chrome131', stream=True, timeout=120)
          r.raise_for_status()
          total = 0
          with open('base.apk', 'wb') as fh:
              for ch in r.iter_content(8192):
                  if ch:
                      fh.write(ch); total += len(ch)
          print(f'{total:,} bytes')
          "
          elif [ "$TYPE" = "apkmirror" ]; then
            python3 tools/apkmirror.py --config "$CFG" \
              --exact-version "${{ steps.resolve.outputs.apk_version }}" \
              --output base.apk
          elif [ "$TYPE" = "github" ]; then
            python3 tools/github_source.py --config "$CFG" \
              --apk-version "${{ steps.resolve.outputs.apk_version }}" \
              --output base.apk
          else
            echo "Unknown source.type: $TYPE"; exit 1
          fi
          ls -la base.apk

      - name: Setup Morphe CLI
        if: steps.check.outputs.skip != 'true'
        run: |
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | grep "browser_download_url.*morphe-desktop.*all.jar" | cut -d '"' -f 4 | head -n 1)
          if [ -z "$CLI_URL" ]; then
            CLI_URL="https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar"
          fi
          echo "CLI: $CLI_URL"
          curl -L -o morphe-cli.jar "$CLI_URL"

      - name: Patch all flavors
        if: steps.check.outputs.skip != 'true'
        run: |
          python3 tools/patch.py --config "apps/${{ matrix.app }}.json" \
            --cli morphe-cli.jar --mpp patches.mpp --base base.apk --workdir .

      - name: Sign APKs
        if: steps.check.outputs.skip != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          # Defaults keep backward compatibility; set the secrets to change them.
          KS_PASS="${KEYSTORE_PASSWORD:-android}"
          KEY_PASS="${KEY_PASSWORD:-android}"
          CFG="apps/${{ matrix.app }}.json"
          APP="${{ matrix.app }}"
          VER="${{ steps.resolve.outputs.apk_version }}"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Build-tools: $BUILD_TOOLS_DIR"
          # Sanity check: base APK version matches the resolver output
          AAPT=$($BUILD_TOOLS_DIR/aapt dump badging base.apk | grep -oP "versionName='\K[^']+" || true)
          echo "aapt base.apk version: $AAPT (resolver: $VER)"
          ASSETS=""
          for FLAVOR in $(python3 -c "import json; print(' '.join(f['name'] for f in json.load(open('$CFG'))['flavors']))"); do
            SUFFIX=$(python3 -c "import json; cfg=json.load(open('$CFG')); print(next(f.get('output_suffix','') for f in cfg['flavors'] if f['name']=='$FLAVOR'))")
            UNSIGNED="${APP}-${FLAVOR}-unsigned.apk"
            ALIGNED="${APP}-${FLAVOR}-aligned.apk"
            FINAL="${APP}-v${VER}${SUFFIX}.apk"
            echo "== Sign $FLAVOR -> $FINAL"
            $BUILD_TOOLS_DIR/zipalign -v 4 "$UNSIGNED" "$ALIGNED"
            python3 -c "import zipfile; i=zipfile.ZipFile('$ALIGNED','r'); o=zipfile.ZipFile('$ALIGNED.fixed','w',compression=zipfile.ZIP_DEFLATED); [o.writestr(x,i.read(x.filename)) for x in i.infolist()]; i.close(); o.close()"
            mv "$ALIGNED.fixed" "$ALIGNED"
            $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:"$KS_PASS" --key-pass pass:"$KEY_PASS" ${KEY_ALIAS:+--ks-key-alias "$KEY_ALIAS"} --out "$FINAL" "$ALIGNED"
            ASSETS="$ASSETS $FINAL"
          done
          echo "ASSETS$ASSETS" | tr ' ' '\n'
          echo "assets=$ASSETS" >> $GITHUB_OUTPUT
          rm -f release.keystore

      - name: Upload artifacts
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ steps.resolve.outputs.tag }}
          path: ${{ matrix.app }}-v*.apk

      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          TITLE="${{ matrix.app }} v${{ steps.resolve.outputs.apk_version }} (mpp ${{ steps.resolve.outputs.mpp_version }})"
          FILES=$(ls ${{ matrix.app }}-v*.apk)
          # shellcheck disable=SC2086
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating assets of release $TAG"
            # shellcheck disable=SC2086
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --title "$TITLE" --latest
          else
            echo "Creating release $TAG"
            # shellcheck disable=SC2086
            gh release create "$TAG" $FILES --title "$TITLE" --latest
          fi
